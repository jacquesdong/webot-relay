_version: 2

welcome:
  description:
    en: "Webot Relay Server"
    zh-CN: "企业微信通知转发服务"

commands:
  service:
    description:
      en: "Manage relay server service"
      zh-CN: "服务管理命令（安装、启动、停止、状态、卸载）"
    install:
      description:
        en: "Install service"
        zh-CN: "安装服务"
    start:
      description:
        en: "Start service"
        zh-CN: "启动服务"
    stop:
      description:
        en: "Stop service"
        zh-CN: "停止服务"
    status:
      description:
        en: "Check service status"
        zh-CN: "查看服务"
    uninstall:
      description:
        en: "Uninstall service"
        zh-CN: "卸载服务"
  run:
    description:
      en: "Run relay server instance"
      zh-CN: "直接在前台运行 HTTP 中继服务器"
    bind:
      description:
        en: "Address to bind to (e.g., :8000 or localhost:8000)"
        zh-CN: "绑定地址（例如：:8000 或 localhost:8000）"
    url:
      description:
        en: "URL to relay requests to"
        zh-CN: "转发请求到的 URL"
    verbose:
      description:
        en: "Enable verbose logging"
        zh-CN: "启用详细日志"

options:
  version:
    description:
      en: "Print version"
      zh-CN: "显示版本信息"

errors:
  parsing_address:
    en: "Error parsing address: %{error}"
    zh-CN: "地址解析错误: %{error}"
  invalid_ip:
    en: "Invalid IP address: %{host}, %{error}"
    zh-CN: "无效的 IP 地址: %{host}, %{error}"
  binding_address:
    en: "Error binding address: %{error}"
    zh-CN: "绑定地址错误: %{error}"
  starting_server:
    en: "Error starting server: %{error}"
    zh-CN: "启动服务器错误: %{error}"
  installing_service:
    en: "Failed to install service: %{error}"
    zh-CN: "安装服务失败: %{error}"
  starting_service:
    en: "Failed to start service: %{error}"
    zh-CN: "启动服务失败: %{error}"
  stopping_service:
    en: "Failed to stop service: %{error}"
    zh-CN: "停止服务失败: %{error}"
  getting_status:
    en: "Failed to get service status: %{error}"
    zh-CN: "获取服务状态失败: %{error}"
  uninstalling_service:
    en: "Failed to uninstall service: %{error}"
    zh-CN: "卸载服务失败: %{error}"

messages:
  service_installed:
    en: "Service installed successfully"
    zh-CN: "服务安装成功"
  service_started:
    en: "Service started successfully"
    zh-CN: "服务启动成功"
  service_stopped:
    en: "Service stopped successfully"
    zh-CN: "服务停止成功"
  service_uninstalled:
    en: "Service uninstalled successfully"
    zh-CN: "服务卸载成功"
  server_running_relay:
    en: "Server running on %{address} [relay]"
    zh-CN: "服务器运行在 %{address} [relay]"
  server_running_dumb:
    en: "Server running on %{address} [dumb]"
    zh-CN: "服务器运行在 %{address} [dumb]"
